<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG in Goa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<script src="config.js"></script>
<link rel="stylesheet" href="/static/tokens.css">

<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: var(--pad); }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: var(--display); font-weight: 700; font-stretch: expanded;
    font-size: clamp(20px, 3.4vw, 30px); letter-spacing: .04em;
    text-transform: uppercase; margin: 0;
  }
  .tag { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .status { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim); margin-right: 6px; vertical-align: middle;
  }
  .dot.on { background: var(--hh-palm); }
  .dot.busy { background: var(--hh-sun); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------------- capture ---------------- */
  .capture { text-align: center; padding: 26px 0 18px; }
  .mic {
    width: 74px; height: 74px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--hh-deep);
    color: var(--hh-sand); font-size: 26px; cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .mic:hover { border-color: var(--hh-sun); }
  .mic[aria-pressed="true"] {
    border-color: var(--hh-sun); color: var(--hh-sun);
    box-shadow: 0 0 0 6px rgba(255,158,61,.10); transform: scale(1.04);
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

  #wave { width: min(100%, 460px); height: 40px; display: block; margin: 14px auto 0; }

  .partial {
    font-family: var(--mono); font-size: 14px; min-height: 1.5em;
    color: var(--hh-sun); margin-top: 8px; word-break: break-word;
  }
  .partial.final { color: var(--hh-sand); }

  .typed { display: flex; gap: 8px; max-width: 620px; margin: 16px auto 0; }
  .typed input {
    flex: 1; background: var(--hh-deep); border: 1px solid var(--line);
    color: var(--hh-sand); border-radius: var(--r);
    padding: 11px 13px; font-family: var(--mono); font-size: 13px;
  }
  .typed button {
    background: var(--hh-sun); color: #17120a; border: 0;
    border-radius: var(--r); padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  .typed button:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------------- the sunline ---------------- */
  .sunline { margin-top: 20px; }
  .sunline-head {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 9px; flex-wrap: wrap;
  }
  .budget-num { margin-left: auto; font-family: var(--mono); font-size: 13px; }
  .track {
    position: relative; height: 30px; border-radius: 6px;
    background: #0d1224; border: 1px solid var(--line); overflow: hidden;
  }
  /* the horizon the sun rises against */
  .horizon {
    position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: var(--line);
  }
  .seg {
    position: absolute; top: 0; bottom: 0;
    transition: width .18s linear, left .18s linear;
  }
  .sun {
    position: absolute; top: 50%; width: 16px; height: 16px;
    border-radius: 50%; background: var(--hh-sun);
    box-shadow: 0 0 16px 3px rgba(255,158,61,.45);
    transform: translate(-50%, -50%);
    transition: left .18s linear, background .18s, box-shadow .18s;
  }
  .track.over .sun {
    background: var(--hh-coral); box-shadow: 0 0 16px 3px rgba(255,95,82,.45);
    /* blown budget tips the sun BELOW the horizon line */
    top: 76%;
  }
  .track.over { border-color: var(--hh-coral); }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 9px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .legend b { color: var(--hh-sand); font-weight: 500; }
  .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 2px;
    margin-right: 5px; vertical-align: middle;
  }

  /* ---------------- results ---------------- */
  .cols { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

  .answer { font-size: 15.5px; white-space: pre-wrap; word-break: break-word; }
  .cite {
    font-family: var(--mono); font-size: 11px; color: var(--hh-palm);
    border: 1px solid var(--hh-palm); border-radius: 4px;
    padding: 0 4px; margin: 0 2px; cursor: pointer; background: none;
  }

  .card {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 12px; margin-bottom: 9px; background: #0f1425;
  }
  .card.hl { border-color: var(--hh-sun); }
  .card-top {
    display: flex; gap: 8px; align-items: center;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .pid { color: var(--hh-sun); }
  .card-body { font-size: 13px; color: #c9d0e2; max-height: 5.4em; overflow: hidden; }
  .card.open .card-body { max-height: none; }
  mark { background: rgba(255,158,61,.22); color: var(--hh-sand); border-radius: 2px; }

  /* ---------------- refusal: as designed as success ---------------- */
  .refusal { border-color: var(--hh-coral); }
  .refusal-why {
    font-family: var(--mono); font-size: 11px; color: var(--hh-coral);
    letter-spacing: .1em; text-transform: lowercase; margin-bottom: 8px;
  }
  .refusal h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .refusal p { margin: 0 0 6px; color: #c9d0e2; }
  .refusal .next { color: var(--muted); font-size: 13px; }

  /* ---------------- guardrail log ---------------- */
  .rails { margin-top: 14px; }
  .rail-row {
    display: flex; gap: 10px; align-items: baseline;
    font-family: var(--mono); font-size: 12px;
    padding: 3px 0; border-bottom: 1px dashed var(--line);
  }
  .rail-row:last-child { border-bottom: 0; }
  .rail-name { min-width: 130px; }
  .rail-detail { color: var(--muted); word-break: break-word; }
  .rail-at { margin-left: auto; color: var(--dim); }

  table.trace { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  table.trace td { padding: 2px 6px 2px 0; }
  table.trace td:last-child { text-align: right; color: var(--muted); }
  .scroll-x { overflow-x: auto; }
  footer { margin: 26px 0 10px; color: var(--dim); font-family: var(--mono); font-size: 11px; }
</style>

<div class="wrap">
  <header>
    <h1>RAG in Goa</h1>
    <span class="tag">hh goa 2026 · task #02</span>
    <span class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></span>
  </header>

  <section class="capture">
    <button class="mic" id="mic" aria-pressed="false"
            aria-describedby="micHint" title="hold to speak">◉</button>
    <div class="hint" id="micHint">hold to speak · or type below</div>
    <canvas id="wave" aria-hidden="true"></canvas>

    <!-- screen readers get the transcript as it updates -->
    <div class="partial" id="partial" role="status" aria-live="polite"></div>

    <form class="typed" id="typedForm">
      <label class="sr-only" for="q">type a question instead</label>
      <input id="q" placeholder="what is a corporation?" autocomplete="off">
      <button type="submit" id="ask">ask</button>
    </form>
  </section>

  <section class="sunline panel" aria-labelledby="sunlineLabel">
    <div class="sunline-head">
      <span class="eyebrow" id="sunlineLabel">the sunline</span>
      <span class="budget-num num" id="budgetNum">— / 200 ms budget</span>
    </div>
    <div class="track" id="track">
      <div class="horizon"></div>
      <div class="sun" id="sun" style="left:0%"></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="cols">
    <section class="panel" id="answerPanel" aria-labelledby="answerLabel">
      <span class="eyebrow" id="answerLabel">answer</span>
      <div class="answer" id="answer" role="status" aria-live="polite"
           style="margin-top:10px">ask something to begin.</div>
    </section>

    <section class="panel" aria-labelledby="retLabel">
      <span class="eyebrow" id="retLabel">retrieved <span id="retCount"></span></span>
      <div id="retrieved" style="margin-top:10px"></div>
    </section>
  </div>

  <section class="panel rails" aria-labelledby="railLabel">
    <span class="eyebrow" id="railLabel">guardrail log</span>
    <div id="rails" style="margin-top:8px"></div>
    <div class="scroll-x"><table class="trace" id="traceTable"></table></div>
  </section>

  <footer>
    core_rag_loop is T2–T6 · stt and generation are reported separately ·
    every number here comes from /trace/<span class="mono">request_id</span>
  </footer>
</div>

<script>
// Where the backend lives. Same-origin when the API serves this page itself;
// on the Hugging Face Static Space the backend is elsewhere, so the URL comes
// from ?api=... (persisted) or window.RAG_API set by config.js.
const API = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q) { try { localStorage.setItem('rag_api', q.replace(/\/$/, '')); } catch (e) {} }
  const stored = (() => { try { return localStorage.getItem('rag_api'); } catch (e) { return null; } })();
  const base = q || window.RAG_API || stored || '';
  return base.replace(/\/$/, '');
})();
const WS_BASE = API
  ? API.replace(/^http/, 'ws')
  : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

const STAGE_COLORS = {
  stt: '#3b4a7a', normalize: '#4b5c93', dense: '#FF9E3D', sparse: '#c9793a',
  fuse: '#7a6bd8', guard: '#2FBF8F', generate: '#2b8f6f'
};
const $ = id => document.getElementById(id);
let BUDGET = 200;

/* ---------------- the sunline ---------------- */
function renderSunline(stages, coreMs, sttMs) {
  const track = $('track');
  [...track.querySelectorAll('.seg')].forEach(n => n.remove());
  const total = Math.max(coreMs || 0, BUDGET);
  let acc = 0;
  for (const s of stages) {
    const d = s.duration_ms || 0;
    if (d <= 0) continue;
    const el = document.createElement('div');
    el.className = 'seg';
    el.style.left = (100 * acc / total) + '%';
    el.style.width = Math.max(0.6, 100 * d / total) + '%';
    el.style.background = STAGE_COLORS[s.name] || '#4b5c93';
    el.title = `${s.name} ${d.toFixed(1)}ms`;
    track.appendChild(el);
    acc += d;
  }
  const over = coreMs > BUDGET;
  track.classList.toggle('over', over);
  // the sun rises in proportion to budget consumed
  $('sun').style.left = Math.min(100, 100 * (coreMs || 0) / total) + '%';
  $('budgetNum').textContent =
    `${(coreMs || 0).toFixed(0)} / ${BUDGET} ms budget` + (over ? ' · over' : '');
  $('budgetNum').className = 'budget-num num ' + (over ? 'fail' : 'live');

  const parts = stages.filter(s => s.duration_ms > 0).map(s =>
    `<span><span class="swatch" style="background:${STAGE_COLORS[s.name] || '#4b5c93'}"></span>` +
    `${s.name} <b>${s.duration_ms.toFixed(1)}</b></span>`);
  if (sttMs) parts.unshift(`<span><span class="swatch" style="background:${STAGE_COLORS.stt}"></span>stt <b>${sttMs.toFixed(0)}</b> <em>(outside budget)</em></span>`);
  $('legend').innerHTML = parts.join('');
}

/* ---------------- refusal: designed, not a toast ---------------- */
const REFUSAL_COPY = {
  off_topic: ["nothing in the corpus covers this",
    "this index is MS MARCO-XI — general web passages, translated into 14 Indic languages.",
    "try rephrasing, or ask about something factual and general."],
  unsafe: ["that request is not one this system answers",
    "the question was classified as unsafe, so retrieval never ran.", ""],
  prompt_injection: ["that looked like an instruction, not a question",
    "the transcript contained text trying to override the system's rules, so it was refused.",
    "ask the question plainly and it will be answered."],
  not_in_retrieved_set: ["the passages found do not contain the answer",
    "retrieval returned related passages, but none of them actually answer this.",
    "try being more specific, or ask a different question."],
  ungrounded: ["the answer could not be verified against a source",
    "a draft was produced but its claims did not hold up against the retrieved text, so it was withheld.", ""],
  unsupported_language: ["that language is not in this corpus",
    "supported: english plus 14 indic languages (hindi, tamil, bengali, telugu, urdu and more).", ""],
  low_confidence_transcript: ["that did not come through clearly",
    "the transcript confidence was below threshold.", "try again, a little closer to the mic."],
  empty_audio: ["no speech detected", "the audio was silent or too short.", "hold the button and speak."],
  pii_detected: ["personal details were removed", "the query contained PII, which was redacted before logging.", ""]
};

function renderRefusal(reason, detail) {
  const [title, body, next] = REFUSAL_COPY[reason] ||
    ["this question was not answered", detail || "", ""];
  $('answerPanel').classList.add('refusal');
  $('answerPanel').innerHTML =
    `<div class="refusal-why">refused · ${reason || 'unknown'}</div>` +
    `<h3>${title}</h3><p>${body}</p>` +
    (next ? `<p class="next">${next}</p>` : '') +
    (detail ? `<p class="next mono" style="margin-top:10px">${detail}</p>` : '');
}

function renderAnswer(ans) {
  $('answerPanel').classList.remove('refusal');
  $('answerPanel').innerHTML =
    `<span class="eyebrow">answer</span><div class="answer" id="answer" role="status" aria-live="polite" style="margin-top:10px"></div>`;
  let html = (ans.answer || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  (ans.citations || []).forEach((c, i) => {
    html += ` <button class="cite" data-pid="${c.passage_id}">[${i + 1}]</button>`;
  });
  $('answer').innerHTML = html;
  $('answer').querySelectorAll('.cite').forEach(b => b.onclick = () => {
    document.querySelectorAll('.card').forEach(el => {
      const on = el.dataset.pid === b.dataset.pid;
      el.classList.toggle('hl', on); el.classList.toggle('open', on);
      if (on) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  });
}

function renderRetrieved(chunks, citations) {
  const cited = new Set((citations || []).map(c => c.passage_id));
  $('retCount').textContent = `(${chunks.length})`;
  $('retrieved').innerHTML = chunks.map(c => {
    const body = (c.text || '').slice(0, 460).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
    const q = (citations || []).find(x => x.passage_id === c.passage_id);
    const shown = q && q.quote && body.includes(q.quote)
      ? body.replace(q.quote, `<mark>${q.quote}</mark>`) : body;
    return `<div class="card ${cited.has(c.passage_id) ? 'hl' : ''}" data-pid="${c.passage_id}">
      <div class="card-top">
        <span class="pid">${c.passage_id.slice(0, 22)}</span>
        <span>${c.lang}</span>
        <span>${c.chunk_strategy || ''}</span>
        <span style="margin-left:auto">score <b class="num">${(c.score || 0).toFixed(4)}</b></span>
      </div><div class="card-body">${shown}</div></div>`;
  }).join('') || '<div class="hint">nothing retrieved.</div>';
  $('retrieved').querySelectorAll('.card').forEach(el =>
    el.onclick = () => el.classList.toggle('open'));
}

function renderRails(trace) {
  $('rails').innerHTML = (trace.guardrails || []).map(g =>
    `<div class="rail-row">
       <span class="rail-name ${g.passed ? 'pass' : 'fail'}">${g.passed ? '✓' : '✕'} ${g.name}</span>
       <span class="rail-detail">${g.detail || ''}</span>
       <span class="rail-at num">${(g.at_ms || 0).toFixed(1)}ms</span>
     </div>`).join('') || '<div class="hint">no guardrail events.</div>';

  const rows = [];
  if (trace.stt_ms) rows.push(['STT_MS (outside budget)', trace.stt_ms.toFixed(0)]);
  if (trace.core_rag_loop_ms) rows.push(['CORE_RAG_LOOP_MS', trace.core_rag_loop_ms.toFixed(1)]);
  if (trace.ttft_ms) rows.push(['TTFT_MS', trace.ttft_ms.toFixed(0)]);
  if (trace.e2e_ms) rows.push(['E2E_MS', trace.e2e_ms.toFixed(0)]);
  (trace.degradations || []).forEach(d => rows.push(['degraded', d]));
  if (trace.stt_provider && trace.stt_provider !== 'sarvam')
    rows.push(['stt provider', trace.stt_provider + ' (fallback)']);
  if (trace.request_id) rows.push(['request_id', trace.request_id]);
  $('traceTable').innerHTML = rows.map(([k, v]) =>
    `<tr><td>${k}</td><td class="num">${v}</td></tr>`).join('');
}

function paint(out) {
  const t = out.trace || {};
  renderSunline(t.stages || [], t.core_rag_loop_ms || 0, t.stt_ms);
  if (out.answer && out.answer.refused) {
    renderRefusal(out.answer.refusal_reason, out.answer.detail || '');
  } else if (out.answer) {
    renderAnswer(out.answer);
  }
  renderRetrieved(out.retrieved || [], (out.answer || {}).citations);
  renderRails(t);
}

function setStatus(text, cls) {
  $('statusText').textContent = text;
  $('dot').className = 'dot ' + (cls || '');
}

/* ---------------- typed fallback ---------------- */
$('typedForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('q').value.trim();
  if (!text) return;
  $('ask').disabled = true; setStatus('thinking', 'busy');
  $('partial').textContent = text; $('partial').classList.add('final');
  try {
    const r = await fetch(API + '/query', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text })
    });
    paint(await r.json());
    setStatus('ready', 'on');
  } catch (err) {
    setStatus('error', ''); $('answer').textContent = 'the service did not respond.';
  }
  $('ask').disabled = false;
};

/* ---------------- voice ---------------- */
let ws, audioCtx, node, stream, analyser, drawing = false;

function drawWave() {
  const c = $('wave'), ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const buf = new Uint8Array(analyser.fftSize);
  const loop = () => {
    if (!drawing) { ctx.clearRect(0, 0, c.width, c.height); return; }
    analyser.getByteTimeDomainData(buf);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = '#FF9E3D'; ctx.beginPath();
    for (let i = 0; i < buf.length; i++) {
      const x = i / buf.length * c.width, y = (buf[i] / 128) * c.height / 2;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    requestAnimationFrame(loop);
  };
  loop();
}

async function startMic() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true }
  });
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; src.connect(analyser);
  drawing = true; drawWave();

  ws = new WebSocket(WS_BASE + '/ws');
  ws.binaryType = 'arraybuffer';
  let streamed = '';
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'partial') { $('partial').textContent = m.text; $('partial').classList.remove('final'); }
    else if (m.type === 'final') { $('partial').textContent = m.text; $('partial').classList.add('final'); }
    else if (m.type === 'speculative') setStatus('retrieving early', 'busy');
    else if (m.type === 'stt_fallback') {
      // The degraded transcriber is batch, so there are no partials and no
      // speculation. Say so rather than letting the transcript just stop.
      setStatus('stt degraded', 'busy');
      $('partial').textContent = 'primary transcriber unavailable — retrying on the fallback';
      $('partial').classList.remove('final');
    }
    else if (m.type === 'token') { streamed += m.text; }
    else if (m.type === 'done') { paint(m); setStatus('ready', 'on'); }
    else if (m.type === 'error') { setStatus('error', ''); }
  };
  node = audioCtx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1) return;
    const f = e.inputBuffer.getChannelData(0), pcm = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 0x7FFF;
    ws.send(pcm.buffer);
  };
  src.connect(node); node.connect(audioCtx.destination);
  setStatus('listening', 'busy');
}

function stopMic() {
  drawing = false;
  try { node && node.disconnect(); } catch (e) {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { audioCtx && audioCtx.close(); } catch (e) {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'end' }));
  setStatus('thinking', 'busy');
}

const mic = $('mic');
let held = false;
const press = async e => {
  e.preventDefault();
  if (held) return; held = true;
  mic.setAttribute('aria-pressed', 'true');
  try { await startMic(); } catch (err) { setStatus('mic blocked', ''); held = false; mic.setAttribute('aria-pressed','false'); }
};
const release = e => {
  if (!held) return; held = false;
  e.preventDefault(); mic.setAttribute('aria-pressed', 'false'); stopMic();
};
mic.addEventListener('mousedown', press);
mic.addEventListener('touchstart', press, { passive: false });
window.addEventListener('mouseup', release);
window.addEventListener('touchend', release);
// keyboard parity: space/enter toggles, so the mic is not mouse-only
mic.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !held) press(e);
});
mic.addEventListener('keyup', e => {
  if (e.key === ' ' || e.key === 'Enter') release(e);
});

fetch(API + '/health').then(r => r.json()).then(h => {
  BUDGET = h.budget_ms || 200;
  $('budgetNum').textContent = `— / ${BUDGET} ms budget`;
  setStatus(h.ready ? 'ready' : 'warming', h.ready ? 'on' : 'busy');
}).catch(() => {
  setStatus('backend offline', '');
